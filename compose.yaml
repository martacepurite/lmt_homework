services:
  app:
    build: ./app
    ports:
      - 8000:8000
    command: fastapi run main.py --host "0.0.0.0" --port 8000
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3

  mock:
    build: ./mock
    command: python radar_mock.py
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mynetwork

networks:
  mynetwork: